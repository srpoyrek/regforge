# Pre-commit hooks for the regforge Python sources.
# Install with:  pre-commit install
# Run manually:  pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml

  - repo: local
    hooks:
      # Isolated env rather than `language: system`: pre-commit does not activate
      # the project venv, so a PATH lookup misses pyright entirely. jinja2 is
      # here so pyright resolves regforge's one runtime import; the pin keeps
      # local commits and CI (`nox -s types`) on the same pyright.
      - id: pyright
        name: pyright (type check)
        entry: pyright
        language: python
        additional_dependencies: ["pyright==1.1.411", "jinja2>=3.0"]
        types: [python]
        pass_filenames: false
