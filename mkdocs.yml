site_name: regforge
site_description: Convert register descriptions between formats (CMSIS-SVD to C and beyond).
site_url: https://srpoyrek.github.io/regforge/
repo_url: https://github.com/srpoyrek/regforge
repo_name: srpoyrek/regforge
docs_dir: docs
site_dir: site

# A broken link or a missing nav entry fails the build (mkdocs build --strict),
# matching tests/docs/test_rules_docs.py.
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - admonition
  - pymdownx.superfences

# Mirrors docs/rules/: the rules, then one entry per input format, then one per
# output target. A new format or target is one line under its heading.
nav:
  - Home: index.md
  - Rules:
      - Overview: rules/README.md
      - Naming: rules/naming.md
      - Families: rules/families.md
      - Address blocks: rules/address-blocks.md
      - Interrupts: rules/interrupts.md
      - Defaults: rules/defaults.md
      - Address math: rules/address-math.md
  - Input formats:
      - CMSIS-SVD: rules/formats/svd.md
  - Output targets:
      - C: rules/targets/c.md
