site_name: regforge
site_description: Convert register descriptions between formats (CMSIS-SVD to C and beyond).
site_url: https://srpoyrek.github.io/regforge/
repo_url: https://github.com/srpoyrek/regforge
repo_name: srpoyrek/regforge
docs_dir: docs
site_dir: site

# A broken link or a missing nav entry fails the build (mkdocs build --strict),
# matching tests/docs/test_rules_docs.py.
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - fenced_code
  - admonition
  - pymdownx.superfences

# Mirrors docs/rules/: the rules by element, top down (device, peripheral, register, field,
# enumerated set, with the cluster beside the register), then one entry per input format, then
# one per output target. A new format or target is one line under its heading.
nav:
  - Home: index.md
  - Rules:
      - Overview: rules/README.md
      - Device:
          - Output structure: rules/device/structure.md
          - Defaults: rules/device/defaults.md
          - Address math: rules/device/address-math.md
          - Access: rules/device/access.md
          - Peripheral:
              - Naming: rules/device/peripheral/naming.md
              - Families: rules/device/peripheral/families.md
              - Address blocks: rules/device/peripheral/address-blocks.md
              - Interrupts: rules/device/peripheral/interrupts.md
              - Arrays: rules/device/peripheral/arrays.md
              - Derived registers and sets: rules/device/peripheral/derived.md
              - Alternate registers: rules/device/peripheral/alternates.md
              - Cluster:
                  - Clusters: rules/device/peripheral/cluster/clusters.md
              - Register:
                  - Bits: rules/device/peripheral/register/bits.md
                  - Data types: rules/device/peripheral/register/data-types.md
                  - Side effects: rules/device/peripheral/register/side-effects.md
                  - Field:
                      - Fields: rules/device/peripheral/register/field/fields.md
                      - Enumerated set:
                          - Enumerated values: rules/device/peripheral/register/field/enum_set/enums.md
  - Input formats:
      - CMSIS-SVD: rules/formats/svd.md
  - Output targets:
      - C: rules/targets/c.md
