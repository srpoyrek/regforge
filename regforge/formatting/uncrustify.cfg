# Default uncrustify configuration for regforge-generated C/C++ output.
#
# Applied only when generation is run with --uncrustify. Override with
# --uncrustify-config to enforce a project's own style instead.

# Indentation: four spaces, no tabs.
indent_with_tabs   = 0
indent_columns     = 4
input_tab_size     = 4
output_tab_size    = 4

# Spacing around parentheses and operators.
sp_inside_paren    = remove
sp_paren_paren     = remove
sp_before_semi     = remove
sp_after_cast      = remove
sp_before_ptr_star = force
sp_after_ptr_star  = remove

# One newline at end of file.
nl_end_of_file     = force
nl_end_of_file_min = 1
